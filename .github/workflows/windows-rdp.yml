 name: Windows RDP Server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2019
    timeout-minutes: 3600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: pwsh
        run: .github/workflows/scripts/win-configure-rdp.ps1

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: .github/workflows/scripts/win-create-user.ps1

      # 新增步骤：使用 AnyDesk 便携版 (Portable) - 无需安装
      - name: Use AnyDesk Portable & Get Connection Code
        shell: pwsh
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD || 'MySecurePassword123!' }}
        run: |
          Write-Host "🚀 开始使用 AnyDesk 便携版 (Portable) - 无需安装"

          # Step 1: 下载 AnyDesk 便携版
          $url = "https://download.anydesk.com/AnyDesk.exe" # 官方下载地址会自动重定向到最新版
          $portablePath = "$env:TEMP\AnyDesk_Portable.exe"
          Write-Host "📥 正在下载便携版 AnyDesk..."
          Invoke-WebRequest -Uri $url -OutFile $portablePath

          # Step 2: 检查文件是否下载成功
          if (-not (Test-Path $portablePath)) {
            Write-Host "❌ 下载失败，文件不存在。"
            exit 1
          }
          Write-Host "✅ 下载成功。"

          # Step 3: 启动 AnyDesk 便携版 (以服务模式启动)
          Write-Host "⚙️  启动 AnyDesk 便携版服务..."
          # --service 参数会以服务方式在后台运行，--get-id 可以在启动时获取ID
          # 这里我们先启动，再获取ID
          Start-Process -FilePath $portablePath -ArgumentList "--service" -WindowStyle Hidden

          # 等待服务初始化
          Write-Host "⏳ 等待 AnyDesk 服务初始化..."
          Start-Sleep -Seconds 10

          # Step 4: 获取连接码 (ID) - 直接对便携版文件执行 --get-id
          Write-Host "🔍 正在获取连接码 (ID)..."
          try {
            $adId = & $portablePath --get-id
            if ($adId -and $adId.Trim()) {
              Write-Host "===================================="
              Write-Host "🎉 AnyDesk 便携版启动成功！"
              Write-Host "🔐 连接码 (ID): $adId"
              Write-Host "🔑 密码       : $env:ANYDESK_PASSWORD"
              Write-Host "💡 在本地电脑打开 AnyDesk 应用，粘贴上方 ID 即可连接。"
              Write-Host "===================================="

              # 写入环境变量供后续步骤使用
              echo "ANYDESK_ID=$adId" >> $env:GITHUB_ENV
              echo "ANYDESK_PASS=$env:ANYDESK_PASSWORD" >> $env:GITHUB_ENV

            } else {
              Write-Host "❌ 错误：未能获取到有效的连接码。请检查日志。"
              exit 1
            }
          } catch {
            Write-Host "❌ 错误：执行获取 ID 命令时发生异常。$_"
            exit 1
          }

      # 原有步骤：显示处理器核心信息 (已修复语法错误)
      - name: Display CPU Core Information
        shell: pwsh
        run: |
          $cpuInfo = Get-CimInstance Win32_Processor
          Write-Host "=== 💻 CPU 核心信息 ==="
          Write-Host "物理核心数: $($cpuInfo.NumberOfCores)"
          Write-Host "逻辑处理器数: $($cpuInfo.NumberOfLogicalProcessors)"
          Write-Host "处理器名称: $($cpuInfo.Name)"
          Write-Host "最大时钟速度: $($cpuInfo.MaxClockSpeed) MHz"
          Write-Host "===================="

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== 🔐 认证信息汇总 ==="

          # 显示 AnyDesk 连接信息 (这是主要目标)
          if ($env:ANYDESK_ID) {
            Write-Host "🟢 AnyDesk 连接信息:"
            Write-Host "   连接码 (ID): $env:ANYDESK_ID"
            Write-Host "   密码       : $env:ANYDESK_PASS"
            Write-Host "--- 或 ---"
          }

          # 显示原有的 RDP/Tailscale 连接信息（如果可用）
          if ($env:TAILSCALE_IP) {
            Write-Host "🌐 Tailscale RDP 连接信息:"
            Write-Host "   地址       : $env:TAILSCALE_IP"
            Write-Host "   用户名     : vum"
            Write-Host "   密码       : $(echo $env:RDP_CREDS)"
          } else {
            Write-Host "🟡 Tailscale 地址未配置或不可用。请确保前面步骤已正确设置。"
          }

          Write-Host "==================`n"

          while ($true) {
            Write-Host "[$(Get-Date)] 系统保持在线... (随时可在 GitHub Actions 页面终止工作流)"
            Start-Sleep -Seconds 300
          }
