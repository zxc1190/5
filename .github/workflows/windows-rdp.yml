name: Windows RDP Server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2019
    timeout-minutes: 3600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: pwsh
        run: .github/workflows/scripts/win-configure-rdp.ps1

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: .github/workflows/scripts/win-create-user.ps1

      # 新增步骤：安装 AnyDesk
      - name: Install AnyDesk Silently
        shell: pwsh
        run: |
          Write-Host "🔽 下载 AnyDesk 安装包..."
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $installerPath = "$env:TEMP\AnyDesk.exe"
          
          # 下载安装包
          Invoke-WebRequest -Uri $url -OutFile $installerPath

          Write-Host "⚙️  静默安装 AnyDesk..."
          # --install 模式会在后台安装服务，允许无人值守访问
          Start-Process -FilePath $installerPath -ArgumentList "--install" -Wait

          # 等待服务初始化
          Start-Sleep -Seconds 10

          # 尝试获取 AnyDesk ID
          Write-Host "🔍 获取连接码..."
          try {
            # 安装后通常会将路径加入环境变量，或者在默认路径
            $adId = anydesk.exe --get-id
            if ($adId) {
              Write-Host "===================================="
              Write-Host "✅ AnyDesk 安装成功！"
              Write-Host "🔑 连接码 (ID): $adId"
              Write-Host "💡 请复制上方 ID，在本地 AnyDesk 客户端中连接。"
              Write-Host "===================================="
              
              # 保存到环境变量，供后续步骤显示
              echo "ANYDESK_ID=$adId" >> $env:GITHUB_ENV
            } else {
              Write-Host "❌ 无法立即获取 ID，请稍后检查日志或手动启动 AnyDesk。"
            }
          } catch {
            Write-Host "❌ 错误: 无法执行 AnyDesk 命令获取 ID。$_"
          }

      # 原有步骤：显示处理器核心信息 (已修复语法错误)
      - name: Display CPU Core Information
        shell: pwsh
        run: |
          $cpuInfo = Get-CimInstance Win32_Processor
          Write-Host "=== 💻 CPU 核心信息 ==="
          Write-Host "物理核心数: $($cpuInfo.NumberOfCores)"
          Write-Host "逻辑处理器数: $($cpuInfo.NumberOfLogicalProcessors)"
          Write-Host "处理器名称: $($cpuInfo.Name)"
          Write-Host "最大时钟速度: $($cpuInfo.MaxClockSpeed) MHz"
          Write-Host "===================="

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== 🔐 认证信息 ==="
          # 显示 AnyDesk 连接码
          Write-Host "AnyDesk ID: $env:ANYDESK_ID"
          Write-Host "--- 或 ---"
          # 显示原有的 Tailscale IP (如果之前配置了的话，否则这行可能为空)
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: vum"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          while ($true) {
            Write-Host "[$(Get-Date)] 会话保持运行中... (随时可以在 Actions 页面点击 Cancel 结束)"
            Start-Sleep -Seconds 300
          }
