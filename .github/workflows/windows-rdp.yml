name: Windows RDP Server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2019
    timeout-minutes: 3600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        shell: pwsh
        run: .github/workflows/scripts/win-configure-rdp.ps1

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: .github/workflows/scripts/win-create-user.ps1

      # 新增步骤：终极优化版安装 AnyDesk 并获取连接码
      - name: Install AnyDesk & Robustly Get Connection Code
        shell: pwsh
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD || 'MySecurePassword123!' }}
        run: |
          Write-Host "🚀 开始终极优化版安装 AnyDesk..."

          # Step 1: 下载安装包
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $installerPath = "$env:TEMP\AnyDesk.exe"
          Write-Host "📥 正在下载安装包..."
          Invoke-WebRequest -Uri $url -OutFile $installerPath

          # Step 2: 静默安装 (带服务模式)
          Write-Host "⚙️  正在静默安装 AnyDesk..."
          Start-Process -FilePath $installerPath -ArgumentList "--install" -Wait

          # Step 3: 强制等待并刷新环境 (关键！)
          Write-Host "⏳ 等待 AnyDesk 安装完成并初始化服务..."
          Start-Sleep -Seconds 30 # 延长等待时间

          # Step 4: 动态探测 AnyDesk.exe 的真实路径
          Write-Host "🔍 正在动态探测 AnyDesk 可执行文件路径..."

          # 定义几个可能的安装路径
          $possiblePaths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe",
            "$env:ProgramFiles(x86)\AnyDesk\AnyDesk.exe",
            "$env:ProgramFiles\AnyDesk\AnyDesk.exe"
          )

          $anydeskExe = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $anydeskExe = $path
              Write-Host "✅ 找到 AnyDesk 可执行文件: $path"
              break
            }
          }

          if (-not $anydeskExe) {
            Write-Host "❌ 所有预设路径均未找到 AnyDesk.exe。"
            Write-Host "❌ 可能是安装失败，或路径被修改。"
            exit 1
          }

          # Step 5: 尝试获取连接码 (ID) - 增加重试机制
          Write-Host "📝 正在尝试获取连接码 (ID)..."
          for ($i = 0; $i -lt 3; $i++) { # 最多重试3次
            try {
              Write-Host "🔄 尝试第 $($i+1) 次..."
              $adId = & $anydeskExe --get-id 2>&1

              # 检查是否成功获取到非空字符串
              if ($adId -and $adId.Trim() -ne "") {
                Write-Host "===================================="
                Write-Host "🎉 AnyDesk 安装并启动成功！"
                Write-Host "🔐 连接码 (ID): $adId"
                Write-Host "🔑 密码       : $env:ANYDESK_PASSWORD"
                Write-Host "💡 在本地电脑打开 AnyDesk 应用，粘贴上方 ID 即可连接。"
                Write-Host "===================================="

                # 写入环境变量供后续步骤使用
                echo "ANYDESK_ID=$adId" >> $env:GITHUB_ENV
                echo "ANYDESK_PASS=$env:ANYDESK_PASSWORD" >> $env:GITHUB_ENV

                break # 成功则跳出循环
              } else {
                Write-Host "⚠️ 第 $($i+1) 次尝试返回空值，等待5秒后重试..."
                Start-Sleep -Seconds 5
              }
            } catch {
              Write-Host "❌ 第 $($i+1) 次尝试失败，错误信息：$_"
              Start-Sleep -Seconds 5
            }
          }

          # 如果最终仍未获取到 ID，则报错退出
          if (-not $env:ANYDESK_ID) {
            Write-Host "❌ 经过多次尝试，仍无法获取到有效的连接码。请检查安装日志。"
            exit 1
          }

      # 原有步骤：显示处理器核心信息 (已修复语法错误)
      - name: Display CPU Core Information
        shell: pwsh
        run: |
          $cpuInfo = Get-CimInstance Win32_Processor
          Write-Host "=== 💻 CPU 核心信息 ==="
          Write-Host "物理核心数: $($cpuInfo.NumberOfCores)"
          Write-Host "逻辑处理器数: $($cpuInfo.NumberOfLogicalProcessors)"
          Write-Host "处理器名称: $($cpuInfo.Name)"
          Write-Host "最大时钟速度: $($cpuInfo.MaxClockSpeed) MHz"
          Write-Host "===================="

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== 🔐 认证信息汇总 ==="

          # 显示 AnyDesk 连接信息 (这是主要目标)
          if ($env:ANYDESK_ID) {
            Write-Host "🟢 AnyDesk 连接信息:"
            Write-Host "   连接码 (ID): $env:ANYDESK_ID"
            Write-Host "   密码       : $env:ANYDESK_PASS"
            Write-Host "--- 或 ---"
          }

          # 显示原有的 RDP/Tailscale 连接信息（如果可用）
          if ($env:TAILSCALE_IP) {
            Write-Host "🌐 Tailscale RDP 连接信息:"
            Write-Host "   地址       : $env:TAILSCALE_IP"
            Write-Host "   用户名     : vum"
            Write-Host "   密码       : $(echo $env:RDP_CREDS)"
          } else {
            Write-Host "🟡 Tailscale 地址未配置或不可用。请确保前面步骤已正确设置。"
          }

          Write-Host "==================`n"

          while ($true) {
            Write-Host "[$(Get-Date)] 系统保持在线... (随时可在 GitHub Actions 页面终止工作流)"
            Start-Sleep -Seconds 300
          }
